[package]
name = "gliff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true }
gtk4.workspace = true
libadwaita.workspace = true
gliff-proto.workspace = true
gliff-transport.workspace = true
gliff-sw.workspace = true
hypr-ipc.workspace = true
bytes.workspace = true
serde.workspace = true
toml = "1"

# The GPU tier (Vulkan + VA-API, dmabufs) and the local keymap follow the
# Linux compositor; other platforms decode on their own paths.
[target.'cfg(target_os = "linux")'.dependencies]
gliff-vk.workspace = true
hypr-capture.workspace = true
drm-fourcc.workspace = true
hypr-input.workspace = true

# VideoToolbox decode and the Metal recombine; gliff-macos hosts this Mac,
# which runs inside the app bundle (--host-bridge).
[target.'cfg(target_os = "macos")'.dependencies]
gliff-mac.workspace = true
gliff-macos.workspace = true
